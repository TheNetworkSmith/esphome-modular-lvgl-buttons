---
# Alarm clock feature package for the nightstand device.
# Provides alarm scheduling (time/enable/sound/snooze) plus LVGL pages:
# alarm_page (settings, swipe), timer_page (HH:MM:SS one-shot, not in swipe),
# alarm_ringing_page (full-screen prompt while sounding), and dismiss confirm.
# Requires the onboard speaker (custom_guition-esp32-s3-4848s040-audio.yaml).
# Alarm/timer tones are on-device WAV files chosen from a shared popup.
# Digital levels, snooze/ramp lengths, and max alarm time are HA/web numbers — not on LVGL.
# Gentle wake ramps min→max for the daily alarm only; timer rings at max (no ramp).
# While a timer is armed/snoozing/ringing it owns audio and suppresses the daily alarm.
# Daily alarm may be limited to selected weekdays (alarm_days_mask); status shows next fire day.

substitutions:
  alarm_hour_default: "7"
  alarm_minute_default: "0"
  alarm_snooze_minutes_default: "9"
  # Default gentle-wake ramp length (minutes); runtime value is alarm_gentle_minutes.
  alarm_gentle_minutes_default: "30"
  # Default auto-dismiss minutes after first ring; runtime value is alarm_cutoff_minutes.
  alarm_cutoff_minutes_default: "60"
  # After this many minutes from first ring, snooze is disabled (must dismiss).
  alarm_snooze_lockout_minutes: "30"
  # Defaults for Alarm Volume Min / Max number entities (HA + web UI).
  alarm_volume_min_default: "50"
  alarm_volume_max_default: "100"

globals:
  - id: alarm_active
    type: bool
    restore_value: no
    initial_value: 'false'
  # Day-of-year of the last ring; persisted so a reboot can't re-trigger the same alarm.
  - id: alarm_last_trigger_day
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: alarm_snoozing
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: snooze_until_minutes
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: alarm_silence_checks
    type: int
    restore_value: no
    initial_value: '0'
  # Suppresses preview sounds while entity states are still restoring at boot.
  - id: alarm_ui_ready
    type: bool
    restore_value: no
    initial_value: 'false'
  # Blocks alarm triggering for a short window after boot so a crash mid-alarm can't reboot-loop.
  - id: alarm_boot_grace_active
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: alarm_time_input_buffer
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: alarm_playback_volume
    type: float
    restore_value: no
    initial_value: '1.0'
  # Unix timestamp of the first ring in this wake cycle. Survives snooze/reboot
  # so volume still hits the target at 30 minutes even if the speaker was off.
  - id: alarm_ramp_started_at
    type: int
    restore_value: yes
    initial_value: '0'
  # Last Volume N% drawn on the ringing page; skip LVGL redraws when unchanged.
  - id: alarm_volume_ui_last
    type: int
    restore_value: no
    initial_value: '-1'
  # Resolved WAV index (0-5) for the current ring/preview. Random is picked once
  # per alarm start (and again when snooze ends via start_alarm), not on each loop.
  - id: alarm_play_sound_index
    type: int
    restore_value: no
    initial_value: '0'
  # One-shot countdown timer (separate from the daily alarm).
  - id: timer_armed
    type: bool
    restore_value: no
    initial_value: 'false'
  # Unix timestamp when the armed timer should fire.
  - id: timer_ends_at
    type: int
    restore_value: no
    initial_value: '0'
  # True while the current ring/snooze cycle belongs to the timer (not daily alarm).
  - id: ring_is_timer
    type: bool
    restore_value: no
    initial_value: 'false'
  # Digit buffer for timer HHMMSS entry (right-fill, max 6 digits).
  - id: timer_input_buffer
    type: std::string
    restore_value: no
    initial_value: '""'
  # Shared sound popup: true = editing timer sound, false = alarm sound.
  - id: sound_picker_for_timer
    type: bool
    restore_value: no
    initial_value: 'false'
  # Bit0=Sun .. Bit6=Sat (ESPTime day_of_week 1..7). Default all days on.
  - id: alarm_days_mask
    type: int
    restore_value: yes
    initial_value: '127'

number:
  - platform: template
    id: alarm_hour
    name: "Alarm Hour"
    icon: mdi:clock-outline
    optimistic: true
    restore_value: true
    initial_value: ${alarm_hour_default}
    min_value: 0
    max_value: 23
    step: 1
    mode: box
    on_value:
      then:
        # Re-arm today's trigger guard so changing the time can fire again the same day.
        - lambda: 'id(alarm_last_trigger_day) = -1;'
        - script.execute: sync_alarm_controls
  - platform: template
    id: alarm_minute
    name: "Alarm Minute"
    icon: mdi:clock-outline
    optimistic: true
    restore_value: true
    initial_value: ${alarm_minute_default}
    min_value: 0
    max_value: 59
    step: 1
    mode: box
    on_value:
      then:
        # Re-arm today's trigger guard so changing the time can fire again the same day.
        - lambda: 'id(alarm_last_trigger_day) = -1;'
        - script.execute: sync_alarm_controls
  - platform: template
    id: alarm_snooze_minutes
    name: "Alarm Snooze Minutes"
    icon: mdi:alarm-snooze
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${alarm_snooze_minutes_default}
    min_value: 1
    max_value: 30
    step: 1
    unit_of_measurement: "min"
    mode: box
  - platform: template
    id: alarm_gentle_minutes
    name: "Gentle Wake Minutes"
    icon: mdi:weather-sunset-up
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${alarm_gentle_minutes_default}
    min_value: 5
    max_value: 30
    step: 1
    unit_of_measurement: "min"
    mode: box
  - platform: template
    id: alarm_cutoff_minutes
    name: "Alarm Max Minutes"
    icon: mdi:timer-off
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${alarm_cutoff_minutes_default}
    min_value: 15
    max_value: 180
    step: 5
    unit_of_measurement: "min"
    mode: box
  - platform: template
    id: alarm_volume_min
    name: "Alarm Volume Min"
    icon: mdi:volume-medium
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${alarm_volume_min_default}
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
  - platform: template
    id: alarm_volume_max
    name: "Alarm Volume Max"
    icon: mdi:volume-high
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${alarm_volume_max_default}
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: box

sensor:
  - platform: template
    id: alarm_playback_volume_pct
    name: "Alarm Playback Volume"
    icon: mdi:volume-medium
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic

switch:
  - platform: template
    id: alarm_enabled
    name: "Alarm Enabled"
    icon: mdi:alarm
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: sync_alarm_controls
    on_turn_off:
      - script.execute: sync_alarm_controls
  - platform: template
    id: gentle_wake_enabled
    name: "Gentle Wake"
    icon: mdi:weather-sunset-up
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: sync_alarm_controls
    on_turn_off:
      - script.execute: sync_alarm_controls

select:
  - platform: template
    id: alarm_sound_choice
    name: "Alarm Sound"
    icon: mdi:music-note
    optimistic: true
    restore_value: true
    initial_option: "Chimes"
    options:
      - "Chimes"
      - "Chords"
      - "Jingle"
      - "Tap"
      - "Transition"
      - "Xylophone"
      - "Random"
    on_value:
      then:
        - script.execute: sync_alarm_controls
  - platform: template
    id: timer_sound_choice
    name: "Timer Sound"
    icon: mdi:timer
    optimistic: true
    restore_value: true
    initial_option: "Chimes"
    options:
      - "Chimes"
      - "Chords"
      - "Jingle"
      - "Tap"
      - "Transition"
      - "Xylophone"
      - "Random"
    on_value:
      then:
        - script.execute: sync_timer_controls
        - script.execute: sync_alarm_controls

script:
  - id: !extend popup_close
    then:
      - lvgl.widget.hide: popup_alarm_sound
      - lvgl.widget.hide: popup_alarm_days
      - if:
          condition:
            lambda: 'return !id(alarm_active);'
          then:
            - script.stop: preview_audio_watchdog
            - script.execute: audio_stop_all
  - id: !extend time_update
    then:
      - script.execute: check_alarm_schedule
      - if:
          condition:
            lambda: 'return id(alarm_active);'
          then:
            - script.execute: update_alarm_ringing_controls
      - script.execute: update_clock_status_label

  - id: check_alarm_schedule
    then:
      - lambda: |-
          auto now = id(system_time).now();
          if (!now.is_valid()) return;

          if (id(alarm_ramp_started_at) > 0 &&
              (int) now.timestamp - id(alarm_ramp_started_at) >=
                  (int) (std::max(15.0f, id(alarm_cutoff_minutes).state) * 60.0f)) {
            id(dismiss_alarm).execute();
            return;
          }

          const int minutes_now = now.hour * 60 + now.minute;

          // Catch-up window: a single missed minute tick must not lose the alarm for the day.
          auto due = [minutes_now](int target) {
            if (target < 0) return false;
            return ((minutes_now - target + 1440) % 1440) <= 5;
          };

          if (id(alarm_snoozing) && due(id(snooze_until_minutes))) {
            id(alarm_snoozing) = false;
            id(snooze_until_minutes) = -1;
            id(start_alarm).execute();
            return;
          }

          // One-shot timer: second-precision fire time.
          if (id(timer_armed) && !id(alarm_active) &&
              id(timer_ends_at) > 0 && (int) now.timestamp >= id(timer_ends_at)) {
            id(timer_armed) = false;
            id(timer_ends_at) = 0;
            id(ring_is_timer) = true;
            id(start_alarm).execute();
            return;
          }

          // Timer owns the device: do not start the daily alarm alongside it.
          if (id(timer_armed) || id(ring_is_timer)) return;

          if (!id(alarm_enabled).state || id(alarm_active) || id(alarm_boot_grace_active)) return;

          // Skip days that are not selected (no catch-up on a later day).
          if (((id(alarm_days_mask) >> (now.day_of_week - 1)) & 1) == 0) return;

          const int alarm_minutes = ((int) id(alarm_hour).state) * 60 + ((int) id(alarm_minute).state);
          if (id(alarm_last_trigger_day) != now.day_of_year && due(alarm_minutes)) {
            id(alarm_last_trigger_day) = now.day_of_year;
            id(ring_is_timer) = false;
            id(start_alarm).execute();
          }

  # ---- audio transport -----------------------------------------------------

  - id: audio_stop_all
    then:
      # Always clear repeat so a failed item cannot be retried forever by the player.
      - media_player.repeat_off:
          id: speaker_media_player_id
          announcement: true
      - media_player.repeat_off: speaker_media_player_id
      - if:
          condition:
            media_player.is_announcing: speaker_media_player_id
          then:
            - media_player.stop:
                id: speaker_media_player_id
                announcement: true
      - if:
          condition:
            not:
              media_player.is_idle: speaker_media_player_id
          then:
            - media_player.stop: speaker_media_player_id

  - id: apply_alarm_volume
    then:
      - media_player.volume_set:
          id: speaker_media_player_id
          volume: !lambda 'return id(alarm_playback_volume);'
      # HA sensor + ringing label only when the displayed integer % changes.
      # Avoids API/LVGL churn every gentle-wake tick under audio memory pressure.
      - if:
          condition:
            lambda: |-
              const int pct = (int) (id(alarm_playback_volume) * 100.0f + 0.5f);
              if (pct == id(alarm_volume_ui_last)) return false;
              id(alarm_volume_ui_last) = pct;
              return true;
          then:
            - sensor.template.publish:
                id: alarm_playback_volume_pct
                state: !lambda 'return id(alarm_volume_ui_last);'
            - if:
                condition:
                  lambda: 'return id(alarm_active);'
                then:
                  - lvgl.label.update:
                      id: alarm_ringing_volume_label
                      text:
                        format: "Volume %d%%"
                        args: ['id(alarm_volume_ui_last)']

  - id: resolve_alarm_sound_index
    then:
      - lambda: |-
          int choice = 0;
          if (id(ring_is_timer) || (id(sound_picker_for_timer) && !id(alarm_active))) {
            choice = id(timer_sound_choice).active_index().value_or(0);
          } else {
            choice = id(alarm_sound_choice).active_index().value_or(0);
          }
          // Index 6 = Random: pick among the six WAV files.
          if (choice == 6) {
            id(alarm_play_sound_index) = (int) (esp_random() % 6);
          } else {
            id(alarm_play_sound_index) = choice;
          }

  - id: play_selected_alarm_sound
    then:
      - if:
          condition:
            lambda: 'return id(alarm_play_sound_index) == 0;'
          then:
            - media_player.speaker.play_on_device_media_file:
                id: speaker_media_player_id
                media_file: sound_chimes
                announcement: true
      - if:
          condition:
            lambda: 'return id(alarm_play_sound_index) == 1;'
          then:
            - media_player.speaker.play_on_device_media_file:
                id: speaker_media_player_id
                media_file: sound_chords
                announcement: true
      - if:
          condition:
            lambda: 'return id(alarm_play_sound_index) == 2;'
          then:
            - media_player.speaker.play_on_device_media_file:
                id: speaker_media_player_id
                media_file: sound_jingle
                announcement: true
      - if:
          condition:
            lambda: 'return id(alarm_play_sound_index) == 3;'
          then:
            - media_player.speaker.play_on_device_media_file:
                id: speaker_media_player_id
                media_file: sound_tap
                announcement: true
      - if:
          condition:
            lambda: 'return id(alarm_play_sound_index) == 4;'
          then:
            - media_player.speaker.play_on_device_media_file:
                id: speaker_media_player_id
                media_file: sound_transition
                announcement: true
      - if:
          condition:
            lambda: 'return id(alarm_play_sound_index) == 5;'
          then:
            - media_player.speaker.play_on_device_media_file:
                id: speaker_media_player_id
                media_file: sound_xylophone
                announcement: true

  # Native repeat_one loops the on-device file. This watchdog only recovers after
  # prolonged silence (not the short gap between natural repeats).
  - id: alarm_audio_watchdog
    mode: restart
    then:
      - lambda: 'id(alarm_silence_checks) = 0;'
      - while:
          condition:
            lambda: 'return id(alarm_active);'
          then:
            - delay: 3s
            - if:
                condition:
                  or:
                    - speaker.is_playing: media_spk_resampling_input
                    - speaker.is_playing: announcement_spk_resampling_input
                then:
                  - lambda: 'id(alarm_silence_checks) = 0;'
                else:
                  - if:
                      condition:
                        lambda: 'return id(alarm_active);'
                      then:
                        - lambda: 'id(alarm_silence_checks) += 1;'
                        # ~15s of silence: pipeline is stuck, not between loops.
                        - if:
                            condition:
                              lambda: 'return id(alarm_silence_checks) >= 5;'
                            then:
                              - logger.log:
                                  level: WARN
                                  format: "Alarm audio silent for ~15s; restarting repeat playback"
                              - lambda: 'id(alarm_silence_checks) = 0;'
                              - script.execute: audio_stop_all
                              - delay: 500ms
                              - media_player.repeat_one:
                                  id: speaker_media_player_id
                                  announcement: true
                              - script.execute: play_selected_alarm_sound
                              - script.execute: apply_alarm_volume

  - id: apply_gentle_wake_volume
    then:
      - lambda: |-
          float target = id(alarm_volume_max).state / 100.0f;
          float start = id(alarm_volume_min).state / 100.0f;
          if (target < 0.0f) target = 0.0f;
          if (target > 1.0f) target = 1.0f;
          if (start < 0.0f) start = 0.0f;
          if (start > target) start = target;
          auto now = id(system_time).now();
          // Arm the wall-clock cutoff on every first ring, including when gentle
          // wake is off (otherwise the 60-minute auto-dismiss never runs).
          if (now.is_valid() && id(alarm_ramp_started_at) <= 0) {
            id(alarm_ramp_started_at) = (int) now.timestamp;
          }
          // Timer rings at max volume immediately (no gentle-wake ramp).
          if (id(ring_is_timer) || !id(gentle_wake_enabled).state) {
            id(alarm_playback_volume) = target;
            return;
          }
          if (!now.is_valid()) {
            id(alarm_playback_volume) = start;
            return;
          }
          if (id(alarm_ramp_started_at) > 0) {
            const float duration = std::max(5.0f, id(alarm_gentle_minutes).state) * 60.0f;
            float t = ((float) (now.timestamp - id(alarm_ramp_started_at))) / duration;
            if (t < 0.0f) t = 0.0f;
            if (t > 1.0f) t = 1.0f;
            id(alarm_playback_volume) = start + (target - start) * t * t * t;
          } else {
            id(alarm_playback_volume) = start;
          }
      - script.execute: apply_alarm_volume

  - id: gradual_alarm_volume
    mode: restart
    then:
      - while:
          condition:
            lambda: |-
              const float target = id(alarm_volume_max).state / 100.0f;
              return id(alarm_active) && id(gentle_wake_enabled).state &&
                     id(alarm_playback_volume) + 0.001f < target;
          then:
            - delay: 10s
            - script.execute: apply_gentle_wake_volume

  - id: start_alarm
    then:
      - script.stop: preview_audio_watchdog
      - script.execute: popup_force_close
      - lambda: |-
          id(alarm_active) = true;
          id(alarm_volume_ui_last) = -1;
      - script.execute: apply_gentle_wake_volume
      - script.execute: sync_alarm_controls
      - script.execute: sync_timer_controls
      - light.turn_on: display_backlight
      - lvgl.page.show:
          id: alarm_ringing_page
          animation: FADE_IN
          time: 300ms
      - script.execute: update_alarm_ringing_controls
      # Loop in the media player instead of stop/replay every clip (less heap thrash).
      - media_player.repeat_one:
          id: speaker_media_player_id
          announcement: true
      - script.execute: resolve_alarm_sound_index
      - script.execute: play_selected_alarm_sound
      - script.execute: alarm_audio_watchdog
      - if:
          condition:
            lambda: 'return !id(ring_is_timer) && id(gentle_wake_enabled).state;'
          then:
            - script.execute: gradual_alarm_volume

  - id: stop_alarm_sound
    then:
      - script.stop: gradual_alarm_volume
      - script.stop: alarm_audio_watchdog
      - script.execute: audio_stop_all

  - id: update_alarm_ringing_controls
    then:
      - lambda: |-
          auto now = id(system_time).now();
          bool allowed = true;
          if (now.is_valid() && id(alarm_ramp_started_at) > 0) {
            allowed = ((int) now.timestamp - id(alarm_ramp_started_at)) < ${alarm_snooze_lockout_minutes} * 60;
          }
          if (allowed) {
            lv_label_set_text(id(alarm_ringing_action_label), "Tap to Snooze");
            lv_label_set_text(id(alarm_ringing_hint_label), "Hold to Dismiss");
          } else {
            lv_label_set_text(id(alarm_ringing_action_label), "Snooze expired");
            lv_label_set_text(id(alarm_ringing_hint_label), "Tap or hold to Dismiss");
          }

  - id: open_dismiss_confirm
    then:
      - if:
          condition:
            lambda: 'return id(alarm_active);'
          then:
            - lvgl.page.show:
                id: alarm_dismiss_confirm_page
                animation: FADE_IN
                time: 200ms

  - id: cancel_dismiss_confirm
    then:
      - if:
          condition:
            lambda: 'return id(alarm_active);'
          then:
            - lvgl.page.show:
                id: alarm_ringing_page
                animation: FADE_IN
                time: 200ms
            - script.execute: update_alarm_ringing_controls
          else:
            - lvgl.page.show:
                id: clock_page
                animation: FADE_OUT
                time: 200ms

  - id: snooze_alarm
    then:
      - if:
          condition:
            lambda: |-
              auto now = id(system_time).now();
              if (!now.is_valid()) return false;
              if (id(alarm_ramp_started_at) > 0 &&
                  ((int) now.timestamp - id(alarm_ramp_started_at)) >= ${alarm_snooze_lockout_minutes} * 60) {
                return false;
              }
              return true;
          then:
            - lambda: 'id(alarm_active) = false;'
            - script.execute: stop_alarm_sound
            - lambda: |-
                auto now = id(system_time).now();
                id(alarm_snoozing) = true;
                int snooze_min = (int) id(alarm_snooze_minutes).state;
                id(snooze_until_minutes) = (now.hour * 60 + now.minute + snooze_min) % 1440;
            - script.execute: sync_alarm_controls
            - script.execute: sync_timer_controls
            - lvgl.page.show:
                id: clock_page
                animation: FADE_OUT
                time: 300ms
            # Flip clock skips LVGL updates while ringing; refresh now that we're back.
            - script.execute: time_update
          else:
            - if:
                condition:
                  lambda: |-
                    auto now = id(system_time).now();
                    return now.is_valid();
                then:
                  # Past snooze lockout (or already ringing past the window): offer dismiss.
                  - script.execute: open_dismiss_confirm
                else:
                  # No reliable clock → dismiss rather than schedule a bad snooze time.
                  - script.execute: dismiss_alarm

  - id: dismiss_alarm
    then:
      - lambda: |-
          id(alarm_active) = false;
          id(alarm_snoozing) = false;
          id(snooze_until_minutes) = -1;
          id(alarm_ramp_started_at) = 0;
          id(ring_is_timer) = false;
          id(timer_armed) = false;
          id(timer_ends_at) = 0;
      - script.execute: stop_alarm_sound
      - script.execute: sync_alarm_controls
      - script.execute: sync_timer_controls
      - lvgl.page.show:
          id: clock_page
          animation: FADE_OUT
          time: 300ms
      # Flip clock skips LVGL updates while ringing; refresh now that we're back.
      - script.execute: time_update

  - id: open_alarm_time_editor
    then:
      - lambda: |-
          char buf[5];
          snprintf(buf, sizeof(buf), "%02d%02d", (int) id(alarm_hour).state, (int) id(alarm_minute).state);
          id(alarm_time_input_buffer) = buf;
          lv_label_set_text(id(alarm_time_error_label), "");
      - script.execute: refresh_alarm_time_editor
      - lvgl.page.show:
          id: alarm_time_page
          animation: MOVE_LEFT
          time: 200ms

  - id: refresh_alarm_time_editor
    then:
      - lambda: |-
          const auto &input = id(alarm_time_input_buffer);
          char display[] = "--:--";
          if (input.size() > 0) display[0] = input[0];
          if (input.size() > 1) display[1] = input[1];
          if (input.size() > 2) display[3] = input[2];
          if (input.size() > 3) display[4] = input[3];
          lv_label_set_text(id(alarm_time_editor_label), display);

  - id: alarm_time_append_digit
    parameters:
      digit: int
    then:
      - lambda: |-
          auto input = id(alarm_time_input_buffer);
          if (input.size() < 4) {
            input += static_cast<char>('0' + digit);
            id(alarm_time_input_buffer) = input;
          }
          lv_label_set_text(id(alarm_time_error_label), "");
      - script.execute: refresh_alarm_time_editor

  - id: clear_alarm_time_editor
    then:
      - lambda: |-
          id(alarm_time_input_buffer).clear();
          lv_label_set_text(id(alarm_time_error_label), "");
      - script.execute: refresh_alarm_time_editor

  - id: delete_alarm_time_digit
    then:
      - lambda: |-
          auto input = id(alarm_time_input_buffer);
          if (!input.empty()) {
            input.pop_back();
            id(alarm_time_input_buffer) = input;
          }
          lv_label_set_text(id(alarm_time_error_label), "");
      - script.execute: refresh_alarm_time_editor

  - id: save_alarm_time
    then:
      - if:
          condition:
            lambda: |-
              const auto &input = id(alarm_time_input_buffer);
              if (input.size() != 4) return false;
              int hour = (input[0] - '0') * 10 + (input[1] - '0');
              int minute = (input[2] - '0') * 10 + (input[3] - '0');
              return hour <= 23 && minute <= 59;
          then:
            - number.set:
                id: alarm_hour
                value: !lambda |-
                  const auto &input = id(alarm_time_input_buffer);
                  return (input[0] - '0') * 10 + (input[1] - '0');
            - number.set:
                id: alarm_minute
                value: !lambda |-
                  const auto &input = id(alarm_time_input_buffer);
                  return (input[2] - '0') * 10 + (input[3] - '0');
            - lvgl.page.show:
                id: alarm_page
                animation: MOVE_RIGHT
                time: 200ms
          else:
            - lvgl.label.update:
                id: alarm_time_error_label
                text: "Use a valid 24-hour time"

  - id: open_alarm_sound_picker
    then:
      - lambda: 'id(sound_picker_for_timer) = false;'
      - lvgl.label.update:
          id: popup_alarm_sound_title
          text: "Alarm Sound"
      - script.execute: sync_alarm_controls
      - lvgl.widget.show: popup_scrim
      - lvgl.widget.show: popup_alarm_sound
      - script.execute: popup_start_timeout

  - id: open_timer_sound_picker
    then:
      - lambda: 'id(sound_picker_for_timer) = true;'
      - lvgl.label.update:
          id: popup_alarm_sound_title
          text: "Timer Sound"
      - script.execute: sync_alarm_controls
      - lvgl.widget.show: popup_scrim
      - lvgl.widget.show: popup_alarm_sound
      - script.execute: popup_start_timeout

  - id: choose_alarm_sound
    parameters:
      sound_name: string
    then:
      - if:
          condition:
            lambda: 'return id(sound_picker_for_timer);'
          then:
            - select.set:
                id: timer_sound_choice
                option: !lambda 'return sound_name;'
          else:
            - select.set:
                id: alarm_sound_choice
                option: !lambda 'return sound_name;'
      - script.execute: popup_start_timeout
      - script.execute: preview_alarm_sound

  - id: open_timer_page
    then:
      - script.execute: refresh_timer_editor
      - script.execute: sync_timer_controls
      - lvgl.page.show:
          id: timer_page
          animation: MOVE_LEFT
          time: 200ms

  - id: refresh_timer_editor
    then:
      - lambda: |-
          if (id(timer_armed)) {
            auto now = id(system_time).now();
            int remaining = 0;
            if (now.is_valid() && id(timer_ends_at) > 0) {
              remaining = id(timer_ends_at) - (int) now.timestamp;
              if (remaining < 0) remaining = 0;
            }
            char buf[16];
            snprintf(buf, sizeof(buf), "%02d:%02d:%02d",
                     remaining / 3600, (remaining % 3600) / 60, remaining % 60);
            lv_label_set_text(id(timer_editor_label), buf);
            lv_label_set_text(id(timer_error_label), "");
            return;
          }
          const auto &input = id(timer_input_buffer);
          char digits[7] = "000000";
          const size_t n = input.size() > 6 ? 6 : input.size();
          for (size_t i = 0; i < n; i++) {
            digits[6 - n + i] = input[i];
          }
          char display[9];
          snprintf(display, sizeof(display), "%c%c:%c%c:%c%c",
                   digits[0], digits[1], digits[2], digits[3], digits[4], digits[5]);
          lv_label_set_text(id(timer_editor_label), display);

  - id: timer_append_digit
    parameters:
      digit: int
    then:
      - if:
          condition:
            lambda: 'return !id(timer_armed) && !(id(ring_is_timer) && (id(alarm_active) || id(alarm_snoozing)));'
          then:
            - lambda: |-
                auto input = id(timer_input_buffer);
                if (input.size() < 6) {
                  input += static_cast<char>('0' + digit);
                  id(timer_input_buffer) = input;
                }
                lv_label_set_text(id(timer_error_label), "");
            - script.execute: refresh_timer_editor

  - id: clear_timer_editor
    then:
      - if:
          condition:
            lambda: 'return !id(timer_armed) && !(id(ring_is_timer) && (id(alarm_active) || id(alarm_snoozing)));'
          then:
            - lambda: |-
                id(timer_input_buffer).clear();
                lv_label_set_text(id(timer_error_label), "");
            - script.execute: refresh_timer_editor

  - id: delete_timer_digit
    then:
      - if:
          condition:
            lambda: 'return !id(timer_armed) && !(id(ring_is_timer) && (id(alarm_active) || id(alarm_snoozing)));'
          then:
            - lambda: |-
                auto input = id(timer_input_buffer);
                if (!input.empty()) {
                  input.pop_back();
                  id(timer_input_buffer) = input;
                }
                lv_label_set_text(id(timer_error_label), "");
            - script.execute: refresh_timer_editor

  - id: clear_active_alarm_for_timer
    then:
      - lambda: |-
          id(alarm_active) = false;
          id(alarm_snoozing) = false;
          id(snooze_until_minutes) = -1;
          id(alarm_ramp_started_at) = 0;
          id(ring_is_timer) = false;
      - script.execute: stop_alarm_sound

  - id: start_timer
    then:
      - if:
          condition:
            lambda: |-
              if (id(timer_armed) || id(ring_is_timer)) return false;
              auto now = id(system_time).now();
              if (!now.is_valid()) return false;
              const auto &input = id(timer_input_buffer);
              if (input.empty()) return false;
              char digits[7] = "000000";
              const size_t n = input.size() > 6 ? 6 : input.size();
              for (size_t i = 0; i < n; i++) {
                digits[6 - n + i] = input[i];
              }
              int hour = (digits[0] - '0') * 10 + (digits[1] - '0');
              int minute = (digits[2] - '0') * 10 + (digits[3] - '0');
              int second = (digits[4] - '0') * 10 + (digits[5] - '0');
              if (hour > 23 || minute > 59 || second > 59) return false;
              return (hour * 3600 + minute * 60 + second) > 0;
          then:
            - if:
                condition:
                  lambda: 'return id(alarm_active) || id(alarm_snoozing);'
                then:
                  - script.execute: clear_active_alarm_for_timer
            - lambda: |-
                auto now = id(system_time).now();
                const auto &input = id(timer_input_buffer);
                char digits[7] = "000000";
                const size_t n = input.size() > 6 ? 6 : input.size();
                for (size_t i = 0; i < n; i++) {
                  digits[6 - n + i] = input[i];
                }
                int hour = (digits[0] - '0') * 10 + (digits[1] - '0');
                int minute = (digits[2] - '0') * 10 + (digits[3] - '0');
                int second = (digits[4] - '0') * 10 + (digits[5] - '0');
                int total = hour * 3600 + minute * 60 + second;
                id(timer_ends_at) = (int) now.timestamp + total;
                id(timer_armed) = true;
                id(ring_is_timer) = false;
                lv_label_set_text(id(timer_error_label), "");
            - script.execute: sync_timer_controls
            - script.execute: update_clock_status_label
            - lvgl.page.show:
                id: clock_page
                animation: FADE_OUT
                time: 300ms
          else:
            - lambda: |-
                auto now = id(system_time).now();
                if (!now.is_valid()) {
                  lv_label_set_text(id(timer_error_label), "Time not synced yet");
                } else {
                  lv_label_set_text(id(timer_error_label), "Enter a valid duration");
                }

  - id: stop_timer
    then:
      - lambda: |-
          id(timer_armed) = false;
          id(timer_ends_at) = 0;
          id(ring_is_timer) = false;
          id(alarm_active) = false;
          id(alarm_snoozing) = false;
          id(snooze_until_minutes) = -1;
          id(alarm_ramp_started_at) = 0;
      - script.execute: stop_alarm_sound
      - script.execute: sync_alarm_controls
      - script.execute: sync_timer_controls
      - script.execute: refresh_timer_editor
      - script.execute: update_clock_status_label

  - id: toggle_timer_start_stop
    then:
      - if:
          condition:
            lambda: |-
              return id(timer_armed) ||
                     (id(ring_is_timer) && (id(alarm_active) || id(alarm_snoozing)));
          then:
            - script.execute: stop_timer
          else:
            - script.execute: start_timer

  - id: update_clock_status_label
    then:
      - lambda: |-
          auto now = id(system_time).now();
          if (id(timer_armed)) {
            int remaining = 0;
            if (now.is_valid() && id(timer_ends_at) > 0) {
              remaining = id(timer_ends_at) - (int) now.timestamp;
              if (remaining < 0) remaining = 0;
            }
            char buf[48];
            if (id(alarm_enabled).state) {
              snprintf(buf, sizeof(buf), "Timer %02d:%02d:%02d \xE2\x80\xA2 Alarm paused",
                       remaining / 3600, (remaining % 3600) / 60, remaining % 60);
            } else {
              snprintf(buf, sizeof(buf), "Timer %02d:%02d:%02d",
                       remaining / 3600, (remaining % 3600) / 60, remaining % 60);
            }
            lv_label_set_text(id(alarm_status_label), buf);
          } else if (id(ring_is_timer) && id(alarm_snoozing)) {
            char buf[48];
            if (id(alarm_enabled).state) {
              snprintf(buf, sizeof(buf), "Timer Snoozed \xE2\x80\xA2 %02d:%02d \xE2\x80\xA2 Alarm paused",
                       id(snooze_until_minutes) / 60, id(snooze_until_minutes) % 60);
            } else {
              snprintf(buf, sizeof(buf), "Timer Snoozed \xE2\x80\xA2 %02d:%02d",
                       id(snooze_until_minutes) / 60, id(snooze_until_minutes) % 60);
            }
            lv_label_set_text(id(alarm_status_label), buf);
          } else if (id(alarm_snoozing)) {
            char buf[32];
            snprintf(buf, sizeof(buf), "Alarm Snoozed \xE2\x80\xA2 %02d:%02d",
                     id(snooze_until_minutes) / 60, id(snooze_until_minutes) % 60);
            lv_label_set_text(id(alarm_status_label), buf);
          } else if (id(alarm_enabled).state) {
            if (id(alarm_days_mask) == 0) {
              lv_label_set_text(id(alarm_status_label), "No alarm scheduled");
            } else if (!now.is_valid()) {
              char buf[32];
              snprintf(buf, sizeof(buf), "Next \xE2\x80\xA2 %02d:%02d",
                       (int) id(alarm_hour).state, (int) id(alarm_minute).state);
              lv_label_set_text(id(alarm_status_label), buf);
            } else {
              static const char *const day_names[] = {
                  "Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
              const int alarm_minutes =
                  ((int) id(alarm_hour).state) * 60 + ((int) id(alarm_minute).state);
              const int minutes_now = now.hour * 60 + now.minute;
              // Today still counts if enabled, not yet triggered, and alarm time not past.
              const bool today_pending =
                  (((id(alarm_days_mask) >> (now.day_of_week - 1)) & 1) != 0) &&
                  id(alarm_last_trigger_day) != now.day_of_year &&
                  minutes_now <= alarm_minutes;
              int found_dow = -1;
              for (int offset = today_pending ? 0 : 1; offset <= 7; offset++) {
                const int dow = ((now.day_of_week - 1 + offset) % 7) + 1;
                if (((id(alarm_days_mask) >> (dow - 1)) & 1) != 0) {
                  found_dow = dow;
                  break;
                }
              }
              if (found_dow < 0) {
                lv_label_set_text(id(alarm_status_label), "No alarm scheduled");
              } else {
                char buf[32];
                snprintf(buf, sizeof(buf), "Next %s \xE2\x80\xA2 %02d:%02d",
                         day_names[found_dow - 1],
                         (int) id(alarm_hour).state, (int) id(alarm_minute).state);
                lv_label_set_text(id(alarm_status_label), buf);
              }
            }
          } else {
            lv_label_set_text(id(alarm_status_label), "Alarm Disabled");
          }

  - id: sync_timer_controls
    then:
      - lvgl.label.update:
          id: timer_sound_choice_label
          text:
            format: "%s"
            args: ['id(timer_sound_choice).current_option().c_str()']
      - script.execute: refresh_timer_editor
      - if:
          condition:
            lambda: |-
              return id(timer_armed) ||
                     (id(ring_is_timer) && (id(alarm_active) || id(alarm_snoozing)));
          then:
            - lvgl.widget.update:
                id: timer_start_stop_button
                bg_color: $button_on_color
            - lvgl.label.update:
                id: timer_start_stop_label
                text: "Stop"
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: timer_start_stop_button
                bg_color: $button_on_color
            - lvgl.label.update:
                id: timer_start_stop_label
                text: "Start"
                text_color: $label_on_color

  - id: open_alarm_days_picker
    then:
      - script.execute: sync_alarm_days_controls
      - lvgl.widget.show: popup_scrim
      - lvgl.widget.show: popup_alarm_days
      - script.execute: popup_start_timeout

  - id: toggle_alarm_day
    parameters:
      day_bit: int
    then:
      - lambda: |-
          id(alarm_days_mask) ^= (1 << day_bit);
      - script.execute: sync_alarm_days_controls
      - script.execute: update_clock_status_label
      - script.execute: popup_start_timeout

  - id: sync_alarm_days_controls
    then:
      - lambda: |-
          static const char *const letters[] = {"S", "M", "T", "W", "T", "F", "S"};
          lv_obj_t *summary[] = {
              id(alarm_day_summary_sun), id(alarm_day_summary_mon), id(alarm_day_summary_tue),
              id(alarm_day_summary_wed), id(alarm_day_summary_thu), id(alarm_day_summary_fri),
              id(alarm_day_summary_sat)};
          for (int i = 0; i < 7; i++) {
            const bool on = ((id(alarm_days_mask) >> i) & 1) != 0;
            lv_label_set_text(summary[i], letters[i]);
            lv_obj_set_style_text_color(
                summary[i],
                on ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x808080),
                LV_PART_MAIN);
          }

      - if:
          condition:
            lambda: 'return ((id(alarm_days_mask) >> 0) & 1) != 0;'
          then:
            - lvgl.widget.update:
                id: alarm_day_opt_sun
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_day_opt_sun_label
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: alarm_day_opt_sun
                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_day_opt_sun_label
                text_color: $label_off_color

      - if:
          condition:
            lambda: 'return ((id(alarm_days_mask) >> 1) & 1) != 0;'
          then:
            - lvgl.widget.update:
                id: alarm_day_opt_mon
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_day_opt_mon_label
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: alarm_day_opt_mon
                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_day_opt_mon_label
                text_color: $label_off_color

      - if:
          condition:
            lambda: 'return ((id(alarm_days_mask) >> 2) & 1) != 0;'
          then:
            - lvgl.widget.update:
                id: alarm_day_opt_tue
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_day_opt_tue_label
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: alarm_day_opt_tue
                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_day_opt_tue_label
                text_color: $label_off_color

      - if:
          condition:
            lambda: 'return ((id(alarm_days_mask) >> 3) & 1) != 0;'
          then:
            - lvgl.widget.update:
                id: alarm_day_opt_wed
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_day_opt_wed_label
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: alarm_day_opt_wed
