                          on_click:
                            then:
                              - script.execute: { id: timer_append_digit, digit: 4 }
                        - text: "5"
                          on_click:
                            then:
                              - script.execute: { id: timer_append_digit, digit: 5 }
                        - text: "6"
                          on_click:
                            then:
                              - script.execute: { id: timer_append_digit, digit: 6 }
                    - buttons:
                        - text: "7"
                          on_click:
                            then:
                              - script.execute: { id: timer_append_digit, digit: 7 }
                        - text: "8"
                          on_click:
                            then:
                              - script.execute: { id: timer_append_digit, digit: 8 }
                        - text: "9"
                          on_click:
                            then:
                              - script.execute: { id: timer_append_digit, digit: 9 }
                    - buttons:
                        - text: "C"
                          on_click:
                            then:
                              - script.execute: clear_timer_editor
                        - text: "0"
                          on_click:
                            then:
                              - script.execute: { id: timer_append_digit, digit: 0 }
                        - text: "DEL"
                          on_click:
                            then:
                              - script.execute: delete_timer_digit
              - button:
                  id: timer_sound_button
                  width: 100%
                  height: 48px
                  bg_color: gray900
                  bg_opa: cover
                  radius: 14
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_cross: center
                  widgets:
                    - label:
                        id: timer_sound_choice_label
                        text: "Chimes"
                        text_font: nunito_24
                        text_color: white
                    - label:
                        text: "Timer sound"
                        text_font: nunito_2026
                        text_color: gray
                  on_short_click:
                    then:
                      - script.execute: open_timer_sound_picker
              - container:
                  width: 100%
                  height: 48px
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - button:
                        width: 48%
                        height: 100%
                        widgets:
                          - label:
                              text: "Back"
                              align: center
                        on_short_click:
                          then:
                            - lvgl.page.show:
                                id: alarm_page
                                animation: MOVE_RIGHT
                                time: 200ms
                    - button:
                        id: timer_start_stop_button
                        width: 48%
                        height: 100%
                        bg_color: $button_on_color
                        widgets:
                          - label:
                              id: timer_start_stop_label
                              text: "Start"
                              text_color: $label_on_color
                              align: center
                        on_short_click:
                          then:
                            - script.execute: toggle_timer_start_stop

    # Full-bleed wake prompt. Centered like loading/OTA (align + y offsets),
    # not flex — flex + page_style padding was leaving this page off-center.
    - id: alarm_ringing_page
      styles: page_style
      pad_all: 0
      widgets:
        - obj:
            width: 100%
            height: 100%
            pad_all: 0
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            widgets:
              - label:
                  align: center
                  y: -130
                  text_font: mdi_icons_40
                  text: $mdi_alarm
                  text_color: $button_on_color
              - label:
                  align: center
                  y: -60
                  text: "Wake Up!"
                  text_font: nunito_48
                  text_color: white
              - label:
                  id: alarm_ringing_volume_label
                  align: center
                  y: 0
                  text: "Volume --%"
                  text_font: nunito_2026
                  text_color: gray
              - button:
                  align: center
                  y: 110
                  width: 360
                  height: 140
                  pad_all: 12
                  bg_color: $button_on_color
                  widgets:
                    - label:
                        text_font: $icon_font
                        text: $mdi_alarm_snooze
                        align: top_mid
                    - label:
                        id: alarm_ringing_action_label
                        text: "Tap to Snooze"
                        text_color: $label_on_color
                        align: center
                    - label:
                        id: alarm_ringing_hint_label
                        text: "Hold to Dismiss"
                        text_color: gray900
                        text_font: nunito_2026
                        align: bottom_mid
                  on_short_click:
                    then:
                      - script.execute: snooze_alarm
                  on_long_press:
                    then:
                      - script.execute: open_dismiss_confirm

    - id: alarm_dismiss_confirm_page
      styles: page_style
      pad_all: 0
      widgets:
        - obj:
            width: 100%
            height: 100%
            pad_all: 0
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            widgets:
              - label:
                  align: center
                  y: -80
                  text: "Dismiss alarm?"
                  text_font: nunito_48
                  text_color: white
              - label:
                  align: center
                  y: -20
                  text: "Alarm will stop completely"
                  text_font: nunito_2026
                  text_color: gray
              - button:
                  align: center
                  x: -95
                  y: 90
                  width: 160
                  height: 80
                  bg_color: $button_off_color
                  widgets:
                    - label:
                        text: "Cancel"
                        text_color: $label_off_color
                        align: center
                  on_short_click:
                    then:
                      - script.execute: cancel_dismiss_confirm
              - button:
                  align: center
                  x: 95
                  y: 90
                  width: 160
                  height: 80
                  bg_color: $button_on_color
                  widgets:
                    - label:
                        text: "Dismiss"
                        text_color: $label_on_color
                        align: center
                  on_short_click:
                    then:
                      - script.execute: dismiss_alarm
