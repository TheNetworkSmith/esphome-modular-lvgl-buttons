                id: alarm_enable_button
                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_enable_label
                text: "Alarm Off"
                text_color: $label_off_color
      - if:
          condition:
            switch.is_on: gentle_wake_enabled
          then:
            - lvgl.widget.update:
                id: gentle_wake_button
                bg_color: $button_on_color
            - lvgl.label.update:
                id: gentle_wake_label
                text: "Gentle Wake On"
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: gentle_wake_button
                bg_color: $button_off_color
            - lvgl.label.update:
                id: gentle_wake_label
                text: "Gentle Wake Off"
                text_color: $label_off_color
      - if:
          condition:
            lambda: |-
              const int idx = id(sound_picker_for_timer)
                  ? id(timer_sound_choice).active_index().value_or(0)
                  : id(alarm_sound_choice).active_index().value_or(0);
              return idx == 0;
          then:
            - lvgl.widget.update:
                id: alarm_sound_opt_chimes
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_sound_opt_chimes_label
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: alarm_sound_opt_chimes
                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_sound_opt_chimes_label
                text_color: $label_off_color
      - if:
          condition:
            lambda: |-
              const int idx = id(sound_picker_for_timer)
                  ? id(timer_sound_choice).active_index().value_or(0)
                  : id(alarm_sound_choice).active_index().value_or(0);
              return idx == 1;
          then:
            - lvgl.widget.update:
                id: alarm_sound_opt_chords
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_sound_opt_chords_label
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: alarm_sound_opt_chords
                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_sound_opt_chords_label
                text_color: $label_off_color
      - if:
          condition:
            lambda: |-
              const int idx = id(sound_picker_for_timer)
                  ? id(timer_sound_choice).active_index().value_or(0)
                  : id(alarm_sound_choice).active_index().value_or(0);
              return idx == 2;
          then:
            - lvgl.widget.update:
                id: alarm_sound_opt_jingle
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_sound_opt_jingle_label
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: alarm_sound_opt_jingle
                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_sound_opt_jingle_label
                text_color: $label_off_color
      - if:
          condition:
            lambda: |-
              const int idx = id(sound_picker_for_timer)
                  ? id(timer_sound_choice).active_index().value_or(0)
                  : id(alarm_sound_choice).active_index().value_or(0);
              return idx == 3;
          then:
            - lvgl.widget.update:
                id: alarm_sound_opt_tap
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_sound_opt_tap_label
                text_color: $label_on_color
          else:
