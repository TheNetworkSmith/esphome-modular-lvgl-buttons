                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_sound_opt_random_label
                text_color: $label_off_color

  # Preview the selected on-device alarm sound at full digital level.
  - id: preview_alarm_sound
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(alarm_ui_ready) && !id(alarm_active);'
          then:
            - script.stop: preview_audio_watchdog
            # Debounce sits before the command, never between a stop and a play.
            - delay: 250ms
            - lambda: 'id(alarm_playback_volume) = id(alarm_volume_max).state / 100.0f;'
            - script.execute: apply_alarm_volume
            - script.execute: resolve_alarm_sound_index
            - script.execute: play_selected_alarm_sound
            - script.execute: preview_audio_watchdog

  # Bounds an announcement preview so a wedged pipeline can't run indefinitely.
  - id: preview_audio_watchdog
    mode: restart
    then:
      - wait_until:
          condition:
            media_player.is_idle: speaker_media_player_id
          timeout: 30s
      - script.execute: audio_stop_all

interval:
  # Second-precision countdown / fire check only while a timer is armed.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(timer_armed);'
          then:
            - script.execute: check_alarm_schedule
            - script.execute: update_clock_status_label
            - script.execute: refresh_timer_editor

esphome:
  on_boot:
    - priority: 200
      then:
        - script.execute: sync_alarm_controls
        - script.execute: sync_timer_controls
    - priority: -10
      then:
        # Only the ring state is cleared; a pending snooze (and its ramp clock) must survive a reboot.
        # Timer countdown is intentionally not restored across reboot (conservative).
        - lambda: |-
            id(alarm_active) = false;
            id(timer_armed) = false;
            id(timer_ends_at) = 0;
            id(ring_is_timer) = false;
            if (!id(alarm_snoozing)) {
              id(alarm_ramp_started_at) = 0;
            }
        - script.execute: audio_stop_all
        - script.execute: sync_alarm_controls
        - script.execute: sync_timer_controls
        - delay: 5s
        - lambda: 'id(alarm_ui_ready) = true;'
        - delay: 20s
        - lambda: 'id(alarm_boot_grace_active) = false;'

