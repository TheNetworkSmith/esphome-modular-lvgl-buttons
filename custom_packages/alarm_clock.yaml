              const int idx = id(sound_picker_for_timer)
                  ? id(timer_sound_choice).active_index().value_or(0)
                  : id(alarm_sound_choice).active_index().value_or(0);
              return idx == 5;
          then:
            - lvgl.widget.update:
                id: alarm_sound_opt_xylophone
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_sound_opt_xylophone_label
                text_color: $label_on_color
          else:
