            - lvgl.label.update:
                id: alarm_day_opt_wed_label
                text_color: $label_off_color

      - if:
          condition:
            lambda: 'return ((id(alarm_days_mask) >> 4) & 1) != 0;'
          then:
            - lvgl.widget.update:
                id: alarm_day_opt_thu
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_day_opt_thu_label
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: alarm_day_opt_thu
                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_day_opt_thu_label
                text_color: $label_off_color

      - if:
          condition:
            lambda: 'return ((id(alarm_days_mask) >> 5) & 1) != 0;'
          then:
            - lvgl.widget.update:
                id: alarm_day_opt_fri
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_day_opt_fri_label
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: alarm_day_opt_fri
                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_day_opt_fri_label
                text_color: $label_off_color

      - if:
          condition:
            lambda: 'return ((id(alarm_days_mask) >> 6) & 1) != 0;'
          then:
            - lvgl.widget.update:
