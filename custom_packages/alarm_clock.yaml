---
# Alarm clock feature package for the nightstand device.
# Provides alarm scheduling (time/enable/sound/snooze) plus the two LVGL
# pages: alarm_page (settings, reachable via swipe) and alarm_ringing_page
# (full-screen wake prompt shown only while the alarm is sounding).
# Requires the onboard speaker (custom_guition-esp32-s3-4848s040-audio.yaml).
# Alarm tones are on-device WAV files chosen from a popup on alarm_page.

substitutions:
  alarm_hour_default: "7"
  alarm_minute_default: "0"
  alarm_snooze_minutes_default: "9"
  alarm_volume_default: "100"

globals:
  - id: alarm_active
    type: bool
    restore_value: no
    initial_value: 'false'
  # Day-of-year of the last ring; persisted so a reboot can't re-trigger the same alarm.
  - id: alarm_last_trigger_day
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: alarm_snoozing
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: snooze_until_minutes
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: alarm_silence_checks
    type: int
    restore_value: no
    initial_value: '0'
  # Suppresses preview sounds while entity states are still restoring at boot.
  - id: alarm_ui_ready
    type: bool
    restore_value: no
    initial_value: 'false'
  # Blocks alarm triggering for a short window after boot so a crash mid-alarm can't reboot-loop.
  - id: alarm_boot_grace_active
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: alarm_time_input_buffer
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: alarm_playback_volume
    type: float
    restore_value: no
    initial_value: '1.0'
  - id: alarm_volume_step
    type: float
    restore_value: no
    initial_value: '0.0'

number:
  - platform: template
    id: alarm_hour
    name: "Alarm Hour"
    icon: mdi:clock-outline
    optimistic: true
    restore_value: true
    initial_value: ${alarm_hour_default}
    min_value: 0
    max_value: 23
    step: 1
    mode: box
    on_value:
      then:
        # Re-arm today's trigger guard so changing the time can fire again the same day.
        - lambda: 'id(alarm_last_trigger_day) = -1;'
        - script.execute: sync_alarm_controls
  - platform: template
    id: alarm_minute
    name: "Alarm Minute"
    icon: mdi:clock-outline
    optimistic: true
    restore_value: true
    initial_value: ${alarm_minute_default}
    min_value: 0
    max_value: 59
    step: 1
    mode: box
    on_value:
      then:
        # Re-arm today's trigger guard so changing the time can fire again the same day.
        - lambda: 'id(alarm_last_trigger_day) = -1;'
        - script.execute: sync_alarm_controls
  - platform: template
    id: alarm_snooze_minutes
    name: "Alarm Snooze Minutes"
    icon: mdi:alarm-snooze
    optimistic: true
    restore_value: true
    initial_value: ${alarm_snooze_minutes_default}
    min_value: 1
    max_value: 30
    step: 1
    mode: box
    on_value:
      then:
        - script.execute: sync_alarm_controls
  - platform: template
    id: alarm_volume
    name: "Alarm Volume"
    icon: mdi:volume-high
    optimistic: true
    restore_value: true
    initial_value: ${alarm_volume_default}
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    on_value:
      then:
        - script.execute: apply_alarm_volume
        - script.execute: sync_alarm_controls
        - script.execute: { id: preview_alarm_sound, source: 2 }

switch:
  - platform: template
    id: alarm_enabled
    name: "Alarm Enabled"
    icon: mdi:alarm
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: sync_alarm_controls
    on_turn_off:
      - script.execute: sync_alarm_controls
  - platform: template
    id: gentle_wake_enabled
    name: "Gentle Wake"
    icon: mdi:weather-sunset-up
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: sync_alarm_controls
    on_turn_off:
      - script.execute: sync_alarm_controls

select:
  - platform: template
    id: alarm_sound_choice
    name: "Alarm Sound"
    icon: mdi:music-note
    optimistic: true
    restore_value: true
    initial_option: "Chimes"
    options:
      - "Chimes"
      - "Chords"
      - "Jingle"
      - "Tap"
      - "Transition"
      - "Xylophone"
    on_value:
      then:
        - script.execute: sync_alarm_controls

script:
  - id: !extend popup_close
    then:
      - lvgl.widget.hide: popup_alarm_sound
      - if:
          condition:
            lambda: 'return !id(alarm_active);'
          then:
            - script.stop: preview_audio_watchdog
            - script.execute: audio_stop_all
  - id: !extend time_update
    then:
      - script.execute: check_alarm_schedule

  - id: check_alarm_schedule
    then:
      - lambda: |-
          auto now = id(system_time).now();
          if (!now.is_valid()) return;
          const int minutes_now = now.hour * 60 + now.minute;

          // Catch-up window: a single missed minute tick must not lose the alarm for the day.
          auto due = [minutes_now](int target) {
            if (target < 0) return false;
            return ((minutes_now - target + 1440) % 1440) <= 5;
          };

          if (id(alarm_snoozing) && due(id(snooze_until_minutes))) {
            id(alarm_snoozing) = false;
            id(snooze_until_minutes) = -1;
            id(start_alarm).execute();
            return;
          }

          if (!id(alarm_enabled).state || id(alarm_active) || id(alarm_boot_grace_active)) return;

          const int alarm_minutes = ((int) id(alarm_hour).state) * 60 + ((int) id(alarm_minute).state);
          if (id(alarm_last_trigger_day) != now.day_of_year && due(alarm_minutes)) {
            id(alarm_last_trigger_day) = now.day_of_year;
            id(start_alarm).execute();
          }

  # ---- audio transport -----------------------------------------------------

  - id: audio_stop_all
    then:
      - if:
          condition:
            media_player.is_announcing: speaker_media_player_id
          then:
            - media_player.stop:
                id: speaker_media_player_id
                announcement: true
      - if:
          condition:
            not:
              media_player.is_idle: speaker_media_player_id
          then:
            - media_player.stop: speaker_media_player_id

  - id: apply_alarm_volume
    then:
      - media_player.volume_set:
          id: speaker_media_player_id
          volume: !lambda 'return id(alarm_playback_volume);'

  - id: play_selected_alarm_sound
    then:
      - script.execute: apply_alarm_volume
      - if:
          condition:
            lambda: 'return id(alarm_sound_choice).active_index() <= 0 || id(alarm_sound_choice).active_index() > 5;'
          then:
            - media_player.speaker.play_on_device_media_file:
                id: speaker_media_player_id
                media_file: sound_chimes
                announcement: true
      - if:
          condition:
            lambda: 'return id(alarm_sound_choice).active_index() == 1;'
          then:
            - media_player.speaker.play_on_device_media_file:
                id: speaker_media_player_id
                media_file: sound_chords
                announcement: true
      - if:
          condition:
            lambda: 'return id(alarm_sound_choice).active_index() == 2;'
          then:
            - media_player.speaker.play_on_device_media_file:
                id: speaker_media_player_id
                media_file: sound_jingle
                announcement: true
      - if:
          condition:
            lambda: 'return id(alarm_sound_choice).active_index() == 3;'
          then:
            - media_player.speaker.play_on_device_media_file:
                id: speaker_media_player_id
                media_file: sound_tap
                announcement: true
      - if:
          condition:
            lambda: 'return id(alarm_sound_choice).active_index() == 4;'
          then:
            - media_player.speaker.play_on_device_media_file:
                id: speaker_media_player_id
                media_file: sound_transition
                announcement: true
      - if:
          condition:
            lambda: 'return id(alarm_sound_choice).active_index() == 5;'
          then:
            - media_player.speaker.play_on_device_media_file:
                id: speaker_media_player_id
                media_file: sound_xylophone
                announcement: true

  # Replay when a short on-device file ends. Health is measured at the
  # resampler, which only starts once the decoder is emitting PCM.
  - id: alarm_audio_watchdog
    mode: restart
    then:
      - lambda: 'id(alarm_silence_checks) = 0;'
      - while:
          condition:
            lambda: 'return id(alarm_active);'
          then:
            - delay: 3s
            - if:
                condition:
                  or:
                    - speaker.is_playing: media_spk_resampling_input
                    - speaker.is_playing: announcement_spk_resampling_input
                then:
                  - lambda: 'id(alarm_silence_checks) = 0;'
                else:
                  - if:
                      condition:
                        lambda: 'return id(alarm_active);'
                      then:
                        - lambda: 'id(alarm_silence_checks) += 1;'
                        - if:
                            condition:
                              lambda: 'return id(alarm_silence_checks) >= 3;'
                            then:
                              - logger.log:
                                  level: WARN
                                  format: "Alarm audio is not reaching the speaker; retrying selected sound"
                              - lambda: 'id(alarm_silence_checks) = 0;'
                        - script.execute: play_selected_alarm_sound

  - id: gradual_alarm_volume
    mode: restart
    then:
      - repeat:
          count: 90
          then:
            - delay: 10s
            - if:
                condition:
                  lambda: 'return id(alarm_active) && id(alarm_playback_volume) < id(alarm_volume).state / 100.0f;'
                then:
                  - lambda: |-
                      id(alarm_playback_volume) = std::min(
                          id(alarm_volume).state / 100.0f,
                          id(alarm_playback_volume) + id(alarm_volume_step));
                  - script.execute: apply_alarm_volume

  - id: start_alarm
    then:
      - script.stop: preview_audio_watchdog
      - script.execute: popup_force_close
      - lambda: |-
          id(alarm_active) = true;
          float target = id(alarm_volume).state / 100.0f;
          id(alarm_playback_volume) = id(gentle_wake_enabled).state ? std::min(0.10f, target) : target;
          id(alarm_volume_step) = (target - id(alarm_playback_volume)) / 90.0f;
      - script.execute: sync_alarm_controls
      - light.turn_on: display_backlight
      - lvgl.page.show:
          id: alarm_ringing_page
          animation: FADE_IN
          time: 300ms
      - script.execute: play_selected_alarm_sound
      - script.execute: alarm_audio_watchdog
      - if:
          condition:
            switch.is_on: gentle_wake_enabled
          then:
            - script.execute: gradual_alarm_volume

  - id: stop_alarm_sound
    then:
      - script.stop: gradual_alarm_volume
      - script.stop: alarm_audio_watchdog
      - script.execute: audio_stop_all

  - id: snooze_alarm
    then:
      - lambda: 'id(alarm_active) = false;'
      - script.execute: stop_alarm_sound
      - lambda: |-
          auto now = id(system_time).now();
          id(alarm_snoozing) = true;
          int snooze_min = (int) id(alarm_snooze_minutes).state;
          id(snooze_until_minutes) = (now.hour * 60 + now.minute + snooze_min) % 1440;
      - script.execute: sync_alarm_controls
      - lvgl.page.show:
          id: clock_page
          animation: FADE_OUT
          time: 300ms

  - id: dismiss_alarm
    then:
      - lambda: |-
          id(alarm_active) = false;
          id(alarm_snoozing) = false;
          id(snooze_until_minutes) = -1;
      - script.execute: stop_alarm_sound
      - script.execute: sync_alarm_controls
      - lvgl.page.show:
          id: clock_page
          animation: FADE_OUT
          time: 300ms

  - id: open_alarm_time_editor
    then:
      - lambda: |-
          char buf[5];
          snprintf(buf, sizeof(buf), "%02d%02d", (int) id(alarm_hour).state, (int) id(alarm_minute).state);
          id(alarm_time_input_buffer) = buf;
          lv_label_set_text(id(alarm_time_error_label), "");
      - script.execute: refresh_alarm_time_editor
      - lvgl.page.show:
          id: alarm_time_page
          animation: MOVE_LEFT
          time: 200ms

  - id: refresh_alarm_time_editor
    then:
      - lambda: |-
          const auto &input = id(alarm_time_input_buffer);
          char display[] = "--:--";
          if (input.size() > 0) display[0] = input[0];
          if (input.size() > 1) display[1] = input[1];
          if (input.size() > 2) display[3] = input[2];
          if (input.size() > 3) display[4] = input[3];
          lv_label_set_text(id(alarm_time_editor_label), display);

  - id: alarm_time_append_digit
    parameters:
      digit: int
    then:
      - lambda: |-
          auto input = id(alarm_time_input_buffer);
          if (input.size() < 4) {
            input += static_cast<char>('0' + digit);
            id(alarm_time_input_buffer) = input;
          }
          lv_label_set_text(id(alarm_time_error_label), "");
      - script.execute: refresh_alarm_time_editor

  - id: clear_alarm_time_editor
    then:
      - lambda: |-
          id(alarm_time_input_buffer).clear();
          lv_label_set_text(id(alarm_time_error_label), "");
      - script.execute: refresh_alarm_time_editor

  - id: delete_alarm_time_digit
    then:
      - lambda: |-
          auto input = id(alarm_time_input_buffer);
          if (!input.empty()) {
            input.pop_back();
            id(alarm_time_input_buffer) = input;
          }
          lv_label_set_text(id(alarm_time_error_label), "");
      - script.execute: refresh_alarm_time_editor

  - id: save_alarm_time
    then:
      - if:
          condition:
            lambda: |-
              const auto &input = id(alarm_time_input_buffer);
              if (input.size() != 4) return false;
              int hour = (input[0] - '0') * 10 + (input[1] - '0');
              int minute = (input[2] - '0') * 10 + (input[3] - '0');
              return hour <= 23 && minute <= 59;
          then:
            - number.set:
                id: alarm_hour
                value: !lambda |-
                  const auto &input = id(alarm_time_input_buffer);
                  return (input[0] - '0') * 10 + (input[1] - '0');
            - number.set:
                id: alarm_minute
                value: !lambda |-
                  const auto &input = id(alarm_time_input_buffer);
                  return (input[2] - '0') * 10 + (input[3] - '0');
            - lvgl.page.show:
                id: alarm_page
                animation: MOVE_RIGHT
                time: 200ms
          else:
            - lvgl.label.update:
                id: alarm_time_error_label
                text: "Use a valid 24-hour time"

  - id: open_alarm_sound_picker
    then:
      - script.execute: sync_alarm_controls
      - lvgl.widget.show: popup_scrim
      - lvgl.widget.show: popup_alarm_sound
      - script.execute: popup_start_timeout

  - id: choose_alarm_sound
    parameters:
      sound_name: string
    then:
      - select.set:
          id: alarm_sound_choice
          option: !lambda 'return sound_name;'
      - script.execute: popup_start_timeout
      - script.execute: { id: preview_alarm_sound, source: 0 }

  - id: sync_alarm_controls
    then:
      - lvgl.label.update:
          id: alarm_time_label
          text:
            format: "%02d:%02d"
            args: ['(int) id(alarm_hour).state', '(int) id(alarm_minute).state']
      - lvgl.label.update:
          id: alarm_snooze_label
          text:
            format: "Snooze %d min"
            args: ['(int) id(alarm_snooze_minutes).state']
      - lvgl.slider.update:
          id: alarm_volume_slider
          value: !lambda 'return (int) id(alarm_volume).state;'
      - lvgl.label.update:
          id: alarm_volume_label
          text:
            format: "Volume %d%%"
            args: ['(int) id(alarm_volume).state']
      - lvgl.label.update:
          id: alarm_sound_choice_label
          text:
            format: "%s"
            args: ['id(alarm_sound_choice).state.c_str()']
      - lambda: |-
          if (id(alarm_snoozing)) {
            char buf[32];
            snprintf(buf, sizeof(buf), "Alarm Snoozed \xE2\x80\xA2 %02d:%02d", id(snooze_until_minutes) / 60, id(snooze_until_minutes) % 60);
            lv_label_set_text(id(alarm_status_label), buf);
          } else if (id(alarm_enabled).state) {
            char buf[32];
            snprintf(buf, sizeof(buf), "Alarm Set \xE2\x80\xA2 %02d:%02d", (int) id(alarm_hour).state, (int) id(alarm_minute).state);
            lv_label_set_text(id(alarm_status_label), buf);
          } else {
            lv_label_set_text(id(alarm_status_label), "Alarm Disabled");
          }
      - if:
          condition:
            lambda: 'return id(alarm_snoozing);'
          then:
            - lvgl.label.update:
                id: alarm_dismiss_label
                text: "Cancel Snooze"
            - lvgl.widget.show: alarm_dismiss_button
          else:
            - if:
                condition:
                  lambda: 'return id(alarm_active);'
                then:
                  - lvgl.label.update:
                      id: alarm_dismiss_label
                      text: "Dismiss Alarm"
                  - lvgl.widget.show: alarm_dismiss_button
                else:
                  - lvgl.widget.hide: alarm_dismiss_button
      - if:
          condition:
            switch.is_on: alarm_enabled
          then:
            - lvgl.widget.update:
                id: alarm_enable_button
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_enable_label
                text: "Alarm On"
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: alarm_enable_button
                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_enable_label
                text: "Alarm Off"
                text_color: $label_off_color
      - if:
          condition:
            switch.is_on: gentle_wake_enabled
          then:
            - lvgl.widget.update:
                id: gentle_wake_button
                bg_color: $button_on_color
            - lvgl.label.update:
                id: gentle_wake_label
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: gentle_wake_button
                bg_color: $button_off_color
            - lvgl.label.update:
                id: gentle_wake_label
                text_color: $label_off_color
      - if:
          condition:
            lambda: 'return id(alarm_sound_choice).active_index() == 0;'
          then:
            - lvgl.widget.update:
                id: alarm_sound_opt_chimes
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_sound_opt_chimes_label
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: alarm_sound_opt_chimes
                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_sound_opt_chimes_label
                text_color: $label_off_color
      - if:
          condition:
            lambda: 'return id(alarm_sound_choice).active_index() == 1;'
          then:
            - lvgl.widget.update:
                id: alarm_sound_opt_chords
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_sound_opt_chords_label
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: alarm_sound_opt_chords
                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_sound_opt_chords_label
                text_color: $label_off_color
      - if:
          condition:
            lambda: 'return id(alarm_sound_choice).active_index() == 2;'
          then:
            - lvgl.widget.update:
                id: alarm_sound_opt_jingle
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_sound_opt_jingle_label
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: alarm_sound_opt_jingle
                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_sound_opt_jingle_label
                text_color: $label_off_color
      - if:
          condition:
            lambda: 'return id(alarm_sound_choice).active_index() == 3;'
          then:
            - lvgl.widget.update:
                id: alarm_sound_opt_tap
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_sound_opt_tap_label
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: alarm_sound_opt_tap
                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_sound_opt_tap_label
                text_color: $label_off_color
      - if:
          condition:
            lambda: 'return id(alarm_sound_choice).active_index() == 4;'
          then:
            - lvgl.widget.update:
                id: alarm_sound_opt_transition
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_sound_opt_transition_label
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: alarm_sound_opt_transition
                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_sound_opt_transition_label
                text_color: $label_off_color
      - if:
          condition:
            lambda: 'return id(alarm_sound_choice).active_index() == 5;'
          then:
            - lvgl.widget.update:
                id: alarm_sound_opt_xylophone
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_sound_opt_xylophone_label
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: alarm_sound_opt_xylophone
                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_sound_opt_xylophone_label
                text_color: $label_off_color

  # source: 0 = selected on-device alarm, 2 = volume sample.
  - id: preview_alarm_sound
    mode: restart
    parameters:
      source: int
    then:
      - if:
          condition:
            lambda: 'return id(alarm_ui_ready) && !id(alarm_active);'
          then:
            - script.stop: preview_audio_watchdog
            # Debounce sits before the command, never between a stop and a play.
            - delay: 250ms
            - lambda: 'id(alarm_playback_volume) = id(alarm_volume).state / 100.0f;'
            - if:
                condition:
                  lambda: 'return source == 2;'
                then:
                  - script.execute: apply_alarm_volume
                  - media_player.speaker.play_on_device_media_file:
                      id: speaker_media_player_id
                      media_file: volume_preview_sound
                      announcement: true
                else:
                  - script.execute: play_selected_alarm_sound
            - script.execute: preview_audio_watchdog

  # Bounds an announcement preview so a wedged pipeline can't run indefinitely.
  - id: preview_audio_watchdog
    mode: restart
    then:
      - wait_until:
          condition:
            media_player.is_idle: speaker_media_player_id
          timeout: 30s
      - script.execute: audio_stop_all

esphome:
  on_boot:
    - priority: 200
      then:
        - script.execute: sync_alarm_controls
    - priority: -10
      then:
        # Only the ring state is cleared; a pending snooze must survive a reboot.
        - lambda: 'id(alarm_active) = false;'
        - script.execute: audio_stop_all
        - script.execute: sync_alarm_controls
        - delay: 5s
        - lambda: 'id(alarm_ui_ready) = true;'
        - delay: 20s
        - lambda: 'id(alarm_boot_grace_active) = false;'

lvgl:
  top_layer:
    widgets:
      - obj:
          id: popup_alarm_sound
          hidden: true
          align: CENTER
          width: 90%
          height: SIZE_CONTENT
          radius: 12
          bg_color: $bg_color
          bg_opa: COVER
          border_width: 2
          border_color: white
          pad_all: 12
          clickable: true
          layout:
            type: flex
            flex_flow: column
            flex_align_main: start
            flex_align_cross: stretch
            pad_row: 8
          widgets:
            - label:
                text: "Alarm Sound"
                text_font: nunito_36
                text_color: white
                align: center
            - button:
                id: alarm_sound_opt_chimes
                height: 48px
                widgets:
                  - label:
                      id: alarm_sound_opt_chimes_label
                      text: "Chimes"
                      align: center
                on_short_click:
                  then:
                    - script.execute:
                        id: choose_alarm_sound
                        sound_name: "Chimes"
            - button:
                id: alarm_sound_opt_chords
                height: 48px
                widgets:
                  - label:
                      id: alarm_sound_opt_chords_label
                      text: "Chords"
                      align: center
                on_short_click:
                  then:
                    - script.execute:
                        id: choose_alarm_sound
                        sound_name: "Chords"
            - button:
                id: alarm_sound_opt_jingle
                height: 48px
                widgets:
                  - label:
                      id: alarm_sound_opt_jingle_label
                      text: "Jingle"
                      align: center
                on_short_click:
                  then:
                    - script.execute:
                        id: choose_alarm_sound
                        sound_name: "Jingle"
            - button:
                id: alarm_sound_opt_tap
                height: 48px
                widgets:
                  - label:
                      id: alarm_sound_opt_tap_label
                      text: "Tap"
                      align: center
                on_short_click:
                  then:
                    - script.execute:
                        id: choose_alarm_sound
                        sound_name: "Tap"
            - button:
                id: alarm_sound_opt_transition
                height: 48px
                widgets:
                  - label:
                      id: alarm_sound_opt_transition_label
                      text: "Transition"
                      align: center
                on_short_click:
                  then:
                    - script.execute:
                        id: choose_alarm_sound
                        sound_name: "Transition"
            - button:
                id: alarm_sound_opt_xylophone
                height: 48px
                widgets:
                  - label:
                      id: alarm_sound_opt_xylophone_label
                      text: "Xylophone"
                      align: center
                on_short_click:
                  then:
                    - script.execute:
                        id: choose_alarm_sound
                        sound_name: "Xylophone"

  pages:
    # Small status overlay on the flip-clock page - added here (not in
    # flip_clock.yaml) so the flip clock widget itself stays untouched.
    - id: !extend clock_page
      widgets:
        - label:
            id: alarm_status_label
            text: "Alarm Disabled"
            text_font: nunito_2026
            text_color: gray
            floating: true
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            align: top_mid
            y: 12
            clickable: true
            on_short_click:
              then:
                - lvgl.page.show: alarm_page

    - id: alarm_page
      styles: page_style
      <<: !include custom_swipe_navigation.yaml
      widgets:
        - container:
            width: 100%
            height: 100%
            pad_left: 12
            pad_right: 12
            pad_top: 6
            pad_bottom: 6
            layout:
              type: flex
              flex_flow: column
              flex_align_main: start
              flex_align_cross: stretch
              pad_row: 10
            widgets:
              - label:
                  text: "Alarm"
                  text_font: nunito_36
                  text_color: white
                  align: center

              - button:
                  id: alarm_dismiss_button
                  height: 50px
                  bg_color: $button_on_color
                  hidden: true
                  widgets:
                    - label:
                        id: alarm_dismiss_label
                        text: "Cancel Snooze"
                        text_color: $label_on_color
                        align: center
                  on_short_click:
                    then:
                      - script.execute: dismiss_alarm

              - button:
                  id: alarm_time_button
                  width: 100%
                  height: 90px
                  bg_color: gray900
                  bg_opa: cover
                  radius: 18
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_cross: center
                  widgets:
                    - label:
                        id: alarm_time_label
                        text: "07:00"
                        text_font: nunito_48
                        text_color: white
                    - label:
                        text: "Set time"
                        text_font: nunito_2026
                        text_color: gray
                  on_short_click:
                    then:
                      - script.execute: open_alarm_time_editor

              - button:
                  id: alarm_enable_button
                  height: 60px
                  bg_color: $button_off_color
                  widgets:
                    - label:
                        id: alarm_enable_label
                        text: "Alarm Off"
                        text_color: $label_off_color
                        align: center
                  on_short_click:
                    then:
                      - switch.toggle: alarm_enabled

              - button:
                  id: alarm_sound_button
                  width: 100%
                  height: 70px
                  bg_color: gray900
                  bg_opa: cover
                  radius: 18
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_cross: center
                  widgets:
                    - label:
                        id: alarm_sound_choice_label
                        text: "Chimes"
                        text_font: nunito_36
                        text_color: white
                    - label:
                        text: "Alarm sound"
                        text_font: nunito_2026
                        text_color: gray
                  on_short_click:
                    then:
                      - script.execute: open_alarm_sound_picker

              - obj:
                  width: 100%
                  height: 48px
                  bg_opa: TRANSP
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_cross: center
                    pad_column: 12
                  widgets:
                    - label:
                        id: alarm_volume_label
                        text: "Volume 100%"
                        text_font: nunito_2026
                        text_color: gray
                        width: 28%
                    - slider:
                        id: alarm_volume_slider
                        width: 70%
                        height: 100%
                        min_value: 0
                        max_value: 100
                        value: ${alarm_volume_default}
                        on_release:
                          - number.set:
                              id: alarm_volume
                              value: !lambda 'return x;'

              - obj:
                  width: 100%
                  height: 60px
                  bg_opa: TRANSP
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - obj:
                        width: 62%
                        height: 100%
                        bg_opa: TRANSP
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_main: space_between
                          flex_align_cross: center
                        widgets:
                          - button:
                              width: 54px
                              height: 54px
                              widgets:
                                - label:
                                    text_font: $icon_font
                                    text: $mdi_chevron_down
                                    align: center
                              on_short_click:
                                then:
                                  - number.set:
                                      id: alarm_snooze_minutes
                                      value: !lambda 'return std::max(1, ((int) id(alarm_snooze_minutes).state) - 1);'
                          - label:
                              id: alarm_snooze_label
                              text: "Snooze 9 min"
                              text_font: nunito_2026
                              text_color: gray
                          - button:
                              width: 54px
                              height: 54px
                              widgets:
                                - label:
                                    text_font: $icon_font
                                    text: $mdi_chevron_up
                                    align: center
                              on_short_click:
                                then:
                                  - number.set:
                                      id: alarm_snooze_minutes
                                      value: !lambda 'return std::min(30, ((int) id(alarm_snooze_minutes).state) + 1);'
                    - button:
                        id: gentle_wake_button
                        width: 34%
                        height: 100%
                        bg_color: $button_off_color
                        widgets:
                          - label:
                              id: gentle_wake_label
                              text: "Gentle Wake"
                              text_font: nunito_2026
                              text_color: $label_off_color
                              align: center
                        on_short_click:
                          then:
                            - switch.toggle: gentle_wake_enabled

    - id: alarm_time_page
      styles: page_style
      widgets:
        - container:
            width: 100%
            height: 100%
            pad_left: 12
            pad_right: 12
            pad_top: 6
            pad_bottom: 6
            layout:
              type: flex
              flex_flow: column
              flex_align_main: start
              flex_align_cross: stretch
              pad_row: 6
            widgets:
              - label:
                  text: "Set Alarm Time"
                  text_font: nunito_36
                  text_color: white
                  align: center
              - obj:
                  width: 100%
                  height: 72px
                  bg_color: gray900
                  bg_opa: cover
                  radius: 18
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_cross: center
                  widgets:
                    - label:
                        id: alarm_time_editor_label
                        text: "--:--"
                        text_font: nunito_48
                        text_color: white
              - label:
                  id: alarm_time_error_label
                  text: ""
                  height: 20px
                  text_font: nunito_2026
                  text_color: $button_on_color
                  text_align: center
                  width: 100%
              - buttonmatrix:
                  id: alarm_time_keypad
                  width: 100%
                  height: 230px
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  pad_column: 8
                  pad_row: 8
                  items:
                    bg_color: $button_off_color
                    bg_opa: cover
                    border_width: 0
                    radius: 14
                    shadow_width: 0
                    text_color: white
                    text_font: nunito_36
                    pressed:
                      bg_color: $button_on_color
                  rows:
                    - buttons:
                        - text: "1"
                          on_click:
                            then:
                              - script.execute: { id: alarm_time_append_digit, digit: 1 }
                        - text: "2"
                          on_click:
                            then:
                              - script.execute: { id: alarm_time_append_digit, digit: 2 }
                        - text: "3"
                          on_click:
                            then:
                              - script.execute: { id: alarm_time_append_digit, digit: 3 }
                    - buttons:
                        - text: "4"
                          on_click:
                            then:
                              - script.execute: { id: alarm_time_append_digit, digit: 4 }
                        - text: "5"
                          on_click:
                            then:
                              - script.execute: { id: alarm_time_append_digit, digit: 5 }
                        - text: "6"
                          on_click:
                            then:
                              - script.execute: { id: alarm_time_append_digit, digit: 6 }
                    - buttons:
                        - text: "7"
                          on_click:
                            then:
                              - script.execute: { id: alarm_time_append_digit, digit: 7 }
                        - text: "8"
                          on_click:
                            then:
                              - script.execute: { id: alarm_time_append_digit, digit: 8 }
                        - text: "9"
                          on_click:
                            then:
                              - script.execute: { id: alarm_time_append_digit, digit: 9 }
                    - buttons:
                        - text: "C"
                          on_click:
                            then:
                              - script.execute: clear_alarm_time_editor
                        - text: "0"
                          on_click:
                            then:
                              - script.execute: { id: alarm_time_append_digit, digit: 0 }
                        - text: "DEL"
                          on_click:
                            then:
                              - script.execute: delete_alarm_time_digit
              - container:
                  width: 100%
                  height: 48px
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - button:
                        width: 48%
                        height: 100%
                        widgets:
                          - label:
                              text: "Cancel"
                              align: center
                        on_short_click:
                          then:
                            - lvgl.page.show:
                                id: alarm_page
                                animation: MOVE_RIGHT
                                time: 200ms
                    - button:
                        width: 48%
                        height: 100%
                        bg_color: $button_on_color
                        widgets:
                          - label:
                              text: "Save"
                              text_color: $label_on_color
                              align: center
                        on_short_click:
                          then:
                            - script.execute: save_alarm_time

    - id: alarm_ringing_page
      styles: page_style
      widgets:
        - container:
            width: 100%
            height: 100%
            pad_all: 16
            layout:
              type: flex
              flex_flow: column
              flex_align_main: space_evenly
              flex_align_cross: center
            widgets:
              - label:
                  text_font: mdi_icons_40
                  text: $mdi_alarm
                  text_color: $button_on_color
              - label:
                  text: "Wake Up!"
                  text_font: nunito_48
                  text_color: white
              - button:
                  width: 80%
                  height: 140px
                  bg_color: $button_on_color
                  widgets:
                    - label:
                        text_font: $icon_font
                        text: $mdi_alarm_snooze
                        align: top_left
                    - label:
                        text: "Tap to Snooze"
                        text_color: $label_on_color
                        align: center
                    - label:
                        text: "Hold to Dismiss"
                        text_color: gray900
                        text_font: nunito_2026
                        align: bottom_mid
                  on_short_click:
                    then:
                      - script.execute: snooze_alarm
                  on_long_press:
                    then:
                      - script.execute: dismiss_alarm
