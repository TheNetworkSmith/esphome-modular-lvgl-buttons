                id: alarm_day_opt_sat
                bg_color: $button_off_color
            - lvgl.label.update:
                id: alarm_day_opt_sat_label
                text_color: $label_off_color

  - id: sync_alarm_controls
    then:
      - lvgl.label.update:
          id: alarm_time_label
          text:
            format: "%02d:%02d"
            args: ['(int) id(alarm_hour).state', '(int) id(alarm_minute).state']
      - lvgl.label.update:
          id: alarm_sound_choice_label
          text:
            format: "%s"
            args: ['id(alarm_sound_choice).current_option().c_str()']
      - script.execute: update_clock_status_label
      - script.execute: sync_alarm_days_controls
      - if:
          condition:
            lambda: 'return id(alarm_snoozing);'
          then:
            - lambda: |-
                lv_label_set_text(id(alarm_dismiss_label),
                    id(ring_is_timer) ? "Cancel Timer Snooze" : "Cancel Snooze");
            - lvgl.widget.show: alarm_dismiss_button
          else:
            - if:
                condition:
                  lambda: 'return id(alarm_active);'
                then:
                  - lambda: |-
                      lv_label_set_text(id(alarm_dismiss_label),
                          id(ring_is_timer) ? "Dismiss Timer" : "Dismiss Alarm");
                  - lvgl.widget.show: alarm_dismiss_button
                else:
                  - lvgl.widget.hide: alarm_dismiss_button
      - if:
          condition:
            switch.is_on: alarm_enabled
          then:
            - lvgl.widget.update:
                id: alarm_enable_button
                bg_color: $button_on_color
            - lvgl.label.update:
                id: alarm_enable_label
                text: "Alarm On"
                text_color: $label_on_color
          else:
