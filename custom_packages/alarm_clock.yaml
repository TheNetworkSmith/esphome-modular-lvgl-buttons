            lambda: |-
              const int idx = id(sound_picker_for_timer)
                  ? id(timer_sound_choice).active_index().value_or(0)
                  : id(alarm_sound_choice).active_index().value_or(0);
              return idx == 4;
          then:
            - lvgl.widget.update:
                id: alarm_sound_opt_transition
